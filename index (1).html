<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حفل تخرج ريما</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: playful teasing first, then tender — a graduation invite for Reema
   IDEA: a meme sequence that "pretends we forgot", then the real playing-card invitation drops in
   PICTURE: the user's own card design, exactly as made, with suits raining around it
   COLOUR and TYPE: blush pink #fde6e6, card red #dc2f45, black ink; Alexandria
   LAYOUT: full-screen tap-through teaser, then card, countdown, details, replies */
:root{color-scheme:light;--bg:#fde6e6;--red:#dc2f45;--ink:#111;--soft:#5b4a4c;--paper:#fff5f5}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Alexandria",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden;height:100svh}
svg.s{display:block;height:auto;aspect-ratio:1;overflow:visible}
.r{fill:var(--red)}.k{fill:var(--ink)}

/* teaser */
.teaser{position:fixed;inset:0;z-index:5;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;padding:max(18px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));cursor:pointer;user-select:none;transition:opacity .6s,visibility .6s}
.teaser.gone{opacity:0;visibility:hidden}
.top{display:flex;justify-content:space-between;align-items:center}
.dots{display:flex;gap:7px}
.dots i{width:9px;height:9px;transform:rotate(45deg);border:1.5px solid var(--red);transition:background .3s}
.dots i.on{background:var(--red)}
.skip{font:500 15px "Alexandria";color:var(--soft);background:none;border:0;padding:10px 6px;cursor:pointer;min-height:44px}
.slide{display:grid;place-items:center;align-content:center;gap:18px;text-align:center}
.slide h2{margin:0;font:700 clamp(30px,9vw,46px)/1.25 "Alexandria";min-height:1.25em}
.slide img{width:min(82vw,400px);max-height:52svh;object-fit:contain;mix-blend-mode:multiply}
.pop{animation:pop .55s cubic-bezier(.2,1.5,.4,1) both}
.pop+img,.pop~img{animation:wob .7s .12s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-4deg)}}
@keyframes wob{from{opacity:0;transform:translateY(30px) scale(.85)}60%{transform:rotate(3deg)}}
.next{justify-self:center;font:500 15px "Alexandria";color:var(--soft);display:flex;gap:8px;align-items:center}
.next svg{width:14px;animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(-6px)}}

/* invitation */
.rain{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.rain svg{position:absolute;top:-60px;width:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115svh) rotate(540deg)}}
.stage{min-height:100svh;display:grid;place-items:center;align-content:center;gap:22px;padding:24px 16px}
.card{width:min(90vw,440px);aspect-ratio:1;border-radius:18px;box-shadow:0 24px 50px -18px rgba(120,20,40,.45);overflow:hidden;opacity:0}
.card img{width:100%;height:100%;display:block}
.opened .card{animation:deal 1s cubic-bezier(.2,1.2,.3,1) .15s both}
@keyframes deal{from{opacity:0;transform:perspective(900px) translateY(-40px) rotateY(-180deg) scale(.6)}to{opacity:1;transform:none}}
.hint{font:500 15px "Alexandria";color:var(--soft);display:flex;align-items:center;gap:8px;text-decoration:none}
.hint svg{width:16px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}

.band{padding:40px max(5vw,16px);max-width:560px;margin:0 auto}
h3{font:600 26px/1.2 "Alexandria";text-align:center;margin:0 0 22px;display:flex;align-items:center;justify-content:center;gap:12px}
h3 svg{width:20px}
.count{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pc{position:relative;background:var(--paper);border:2px solid var(--ink);border-radius:12px;aspect-ratio:3/4;display:grid;place-items:center;align-content:center;box-shadow:0 10px 22px -14px rgba(120,20,40,.6)}
.pc svg{position:absolute;width:16px;top:8px;right:8px}
.pc strong{font:600 clamp(24px,7.5vw,38px)/1 "Alexandria";color:var(--red);font-variant-numeric:tabular-nums}
.pc span{font-size:14px;color:var(--soft);margin-top:6px}
.done{text-align:center;font:600 20px "Alexandria";color:var(--red);display:none}
.details{list-style:none;margin:0;padding:0;background:var(--paper);border:2px solid var(--ink);border-radius:18px;overflow:hidden}
.details li{display:flex;gap:16px;align-items:center;padding:18px 20px}
.details li+li{border-top:1px dashed #d9a9b0}
.details li>svg{width:26px;flex:none}
.details small{display:block;color:var(--soft);font-size:14px}
.details b{font:500 18px/1.4 "Alexandria"}
.btns{display:grid;gap:12px;margin-top:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:14px;font:600 17px "Alexandria";text-decoration:none;border:2px solid var(--ink);color:var(--ink)}
.btn.main{background:var(--red);border-color:var(--red);color:#fff}
.btn svg{width:18px;fill:currentColor}
.btn:focus-visible,.skip:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.again{display:block;margin:18px auto 0;background:none;border:0;font:500 15px "Alexandria";color:var(--soft);text-decoration:underline;cursor:pointer;min-height:44px}
.bye{margin:4px 0 0;font:600 clamp(26px,7.5vw,34px)/1.3 "Alexandria";text-align:center;opacity:0}.opened .bye,.opened .stage .row{animation:up .8s .9s both}@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1}}.stage .row{display:flex;justify-content:center;gap:14px}.stage .row svg{width:22px}
.crew{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin-top:34px;opacity:0}
.opened .crew{animation:up .8s 1.2s both}
.mate{position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.guy{display:block;width:clamp(64px,19vw,86px);height:auto;transform-origin:50% 100%;animation:dance .9s ease-in-out infinite alternate}
.mate:nth-child(2) .guy{animation-delay:-.3s}.mate:nth-child(3) .guy{animation-delay:-.6s}.mate:nth-child(4) .guy{animation-delay:-.15s;animation-duration:.7s}
@keyframes dance{0%{transform:translateY(0) rotate(-7deg) scale(1,.95)}50%{transform:translateY(-12px) rotate(0) scale(.97,1.05)}100%{transform:translateY(0) rotate(7deg) scale(1,.95)}}
.guy .al,.guy .ar{transform-box:view-box;animation:wave .45s ease-in-out infinite alternate}
.guy .al{transform-origin:24px 70px}.guy .ar{transform-origin:96px 70px;animation-delay:-.2s}
@keyframes wave{from{transform:rotate(-28deg)}to{transform:rotate(22deg)}}
.guy .eye{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
.mate:nth-child(odd) .eye{animation-delay:-1.7s}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.mate.hop .guy{animation:hop .9s cubic-bezier(.3,1.4,.5,1)}
@keyframes hop{0%{transform:scale(1.1,.8)}35%{transform:translateY(-70px) rotate(200deg)}70%{transform:translateY(-20px) rotate(360deg)}85%{transform:scale(1.15,.85)}100%{transform:none}}
.bub{position:absolute;bottom:100%;left:50%;transform:translate(-50%,8px) scale(.6);opacity:0;white-space:nowrap;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:4px 10px;font:600 14px "Alexandria";pointer-events:none;transition:.25s cubic-bezier(.2,1.5,.4,1);z-index:2}
.bub::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink)}
.mate.talk .bub{opacity:1;transform:translate(-50%,-4px) scale(1)}
.tapme{font-size:13px;color:var(--soft);text-align:center;margin:8px 0 0;opacity:0}
.opened .tapme{animation:up .8s 1.6s both}
.peeker{position:absolute;bottom:58px;left:10px;width:78px;transform:translateY(130%);pointer-events:none}
.peeker .guy{animation:none;width:78px}
.peeker.peek{animation:peek .9s cubic-bezier(.2,1.5,.4,1) both}
@keyframes peek{from{transform:translateY(130%) rotate(0)}to{transform:translateY(40%) rotate(14deg)}}
.peeker .bub{left:100%;bottom:70%}
.peeker.peek .bub{opacity:1;transform:translate(-30%,0) scale(1);transition-delay:.5s}
footer{text-align:center;padding:24px 16px 60px;font:600 21px "Alexandria"}
footer .row{display:flex;justify-content:center;gap:14px;margin-top:14px}
footer svg{width:22px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.card{opacity:1}}
</style>
</head>

 const $ = id => document.getElementById(id);

 const FACE = {heart:48, diamond:58, spade:68, club:66};
 const HAT = ['#dc2f45','#6fa8ff','#f4b400','#dc2f45'];
 const guy = (k, n) => {
  const red = k === 'heart' || k === 'diamond', fy = FACE[k], c = red ? 'var(--red)' : 'var(--ink)';
  return '<svg class="guy" viewBox="-6 -34 132 196" aria-hidden="true"><g stroke="#111" stroke-width="4" stroke-linecap="round" fill="none">' +
   '<path d="M50 100 46 150M72 100 76 150"/><path class="al" d="M24 70 4 46"/><path class="ar" d="M96 70 116 46"/></g>' +
   '<ellipse cx="41" cy="152" rx="9" ry="5" fill="#111"/><ellipse cx="81" cy="152" rx="9" ry="5" fill="#111"/>' +
   '<use href="#' + k + '" x="10" y="8" width="100" height="100" style="fill:' + c + '"/>' +
   '<g transform="rotate(-14 60 12)"><path d="M60 -26 47 14h26z" fill="' + HAT[n % 4] + '" stroke="#111" stroke-width="3" stroke-linejoin="round"/><path d="M53 0h14M50 8h20" stroke="#fff" stroke-width="2.5"/><circle cx="60" cy="-27" r="6" fill="#ffd54a" stroke="#111" stroke-width="3"/></g>' +

   '<path d="M52 ' + (fy + 15) + 'q8 9 16 0" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>';
 };
 const LINES = {
  heart: ['لا تتأخرين!', 'حضورك يفرّحنا', 'بنستناك 🤍'],
  club: ['ترا بنرقص!', 'جهّزي الفستان', 'يلا يلا!'],
  diamond: ['خريجة يا جماعة!', 'أخيييراً', 'مبرووك ريما'],
  spade: ['أنا أول الحاضرين', 'لا تقولين نسيتي', 'بنصوّر كثير']
 };
 const crew = $('crew');
 crew.innerHTML = ['heart','club','diamond','spade'].map((k, i) =>
  '<div class="mate" data-k="' + k + '"><span class="bub"></span>' + guy(k, i) + '</div>').join('');
 crew.addEventListener('click', e => {
  const m = e.target.closest('.mate'); if (!m) return;
  const L = LINES[m.dataset.k]; m.n = ((m.n || 0) + 1) % L.length;
  m.querySelector('.bub').textContent = L[m.n];
  m.classList.remove('hop', 'talk'); void m.offsetWidth; m.classList.add('hop', 'talk');
  clearTimeout(m.t); m.t = setTimeout(() => m.classList.remove('talk', 'hop'), 1800);
 });
 const peeker = $('peeker');
 peeker.innerHTML = '<span class="bub"></span>' + guy('heart', 1);
 const PEEK = ['همم؟ 👀', 'أوبس!', 'هاه؟!', 'سرّ بيننا 🤫', 'يا هلااا!'];
 const teaser = $('teaser'), slide = $('slide'), dots = $('dots');

 SLIDES.forEach(s => { const i = new Image(); i.src = s.img; });
 let at = 0;
 const show = () => {
  const s = SLIDES[at];
  slide.innerHTML = '';
  const h = document.createElement('h2'); h.className = 'pop'; h.textContent = s.t;
  const im = document.createElement('img'); im.src = s.img; im.alt = s.alt || s.t;
  slide.append(h, im);
  peeker.classList.remove('peek'); void peeker.offsetWidth; peeker.classList.add('peek');
  peeker.querySelector('.bub').textContent = PEEK[at];
  [...dots.children].forEach((d, i) => d.classList.toggle('on', i <= at));
 };
 const rain = () => {
  const box = $('rain'), suits = ['heart','club','diamond','spade'];
  for (let i = 0; i < 34; i++) {
   const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
   const k = suits[i % 4];
   s.setAttribute('viewBox','0 0 100 100'); s.setAttribute('class','s ' + (k === 'heart' || k === 'diamond' ? 'r' : 'k'));
   s.innerHTML = '<use href="#' + k + '"/>';
   s.style.left = Math.random() * 96 + 'vw';
   s.style.width = 16 + Math.random() * 22 + 'px';
   s.style.animationDuration = 2.4 + Math.random() * 2 + 's';
   s.style.animationDelay = Math.random() * 1.2 + 's';
   box.appendChild(s);
  }
  setTimeout(() => box.innerHTML = '', 5000);
 };
 const finish = () => {
  teaser.classList.add('gone');
  document.body.classList.remove('locked');
  document.body.classList.remove('opened'); void document.body.offsetWidth;
  document.body.classList.add('opened');
  window.scrollTo(0, 0);
  rain();
 };
 const next = () => { if (at < SLIDES.length - 1) { at++; show(); } else finish(); };
 teaser.addEventListener('click', e => { if (e.target.closest('#skip')) return; next(); });
 teaser.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowLeft') { e.preventDefault(); next(); } });

 show();
